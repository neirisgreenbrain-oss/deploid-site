<svg xmlns="http://www.w3.org/2000/svg" width="600" height="930" viewBox="0 0 600 930" role="img"><title>Заказ связан с исполнителем и результатом</title><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#2b4052" stroke-width=".5"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122231"/><stop offset="1" stop-color="#223a50"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/><g font-family="Arial,sans-serif"><text x="32" y="48" font-size="16" fill="#a5c0d6" font-weight="400">СХЕМА РЕШЕНИЯ</text><text x="480" y="48" font-size="14" fill="#a5c0d6" font-weight="400">ДЕПЛОИД.</text><rect x="32" y="90" width="536" height="218" rx="12" fill="#20374b" stroke="#4e6a82"/><text x="56" y="125" font-size="14" fill="#b0c9df" font-weight="400">ЗАЯВКА</text><text x="56" y="169" font-size="29" fill="#fff" font-weight="500">Один заказ</text><circle cx="61" cy="201" r="3" fill="#9cc6f7"/><text x="76" y="207" font-size="21" fill="#d0deea" font-weight="400">Задание и файлы</text><circle cx="61" cy="231" r="3" fill="#9cc6f7"/><text x="76" y="237" font-size="21" fill="#d0deea" font-weight="400">Статус работы</text><circle cx="61" cy="261" r="3" fill="#9cc6f7"/><text x="76" y="267" font-size="21" fill="#d0deea" font-weight="400">История действий</text><path d="M300 308V338" stroke="#7ca4ca" stroke-width="2"/><circle cx="300" cy="323" r="4" fill="#a9cefa"/><rect x="32" y="338" width="536" height="218" rx="12" fill="#2a4c6d" stroke="#8eb5df"/><text x="56" y="373" font-size="14" fill="#b0c9df" font-weight="400">РОЛИ</text><text x="56" y="417" font-size="29" fill="#fff" font-weight="500">Каждому — своё</text><circle cx="61" cy="449" r="3" fill="#9cc6f7"/><text x="76" y="455" font-size="21" fill="#d0deea" font-weight="400">Владелец: весь процесс</text><circle cx="61" cy="479" r="3" fill="#9cc6f7"/><text x="76" y="485" font-size="21" fill="#d0deea" font-weight="400">Исполнитель: свои задачи</text><circle cx="61" cy="509" r="3" fill="#9cc6f7"/><text x="76" y="515" font-size="21" fill="#d0deea" font-weight="400">Доступы разделены</text><path d="M300 556V586" stroke="#7ca4ca" stroke-width="2"/><circle cx="300" cy="571" r="4" fill="#a9cefa"/><rect x="32" y="586" width="536" height="218" rx="12" fill="#20374b" stroke="#4e6a82"/><text x="56" y="621" font-size="14" fill="#b0c9df" font-weight="400">УЧЁТ</text><text x="56" y="665" font-size="29" fill="#fff" font-weight="500">Результат на месте</text><circle cx="61" cy="697" r="3" fill="#9cc6f7"/><text x="76" y="703" font-size="21" fill="#d0deea" font-weight="400">Файлы привязаны к заказу</text><circle cx="61" cy="727" r="3" fill="#9cc6f7"/><text x="76" y="733" font-size="21" fill="#d0deea" font-weight="400">Расчёты учтены</text><circle cx="61" cy="757" r="3" fill="#9cc6f7"/><text x="76" y="763" font-size="21" fill="#d0deea" font-weight="400">Данные хранятся в SQLite</text><text x="35" y="858" font-size="17" fill="#b4cadc" font-weight="400">Notion недоступен? Данные остаются в</text><text x="35" y="882" font-size="17" fill="#b4cadc" font-weight="400">системе, синхронизация идёт через очередь.</text></g></svg>