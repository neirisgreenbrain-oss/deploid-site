<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><title>От исходных файлов до проверенного комплекта</title><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#2b4052" stroke-width=".5"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122231"/><stop offset="1" stop-color="#223a50"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/><g font-family="Arial,sans-serif"><text x="45" y="48" font-size="15" fill="#a5c0d6" font-weight="400">СХЕМА РЕШЕНИЯ</text><text x="1040" y="48" font-size="16" fill="#a5c0d6" font-weight="400">ДЕПЛОИД.</text><text x="45" y="113" font-size="32" fill="#edf4fc" font-weight="400">От исходных файлов до проверенного комплекта</text><path d="M80 310H1120" stroke="#7897b1" stroke-width="2" fill="none"/><rect x="45" y="175" width="350" height="300" rx="12" fill="#20374b" stroke="#4e6a82"/><text x="69" y="210" font-size="14" fill="#b0c9df" font-weight="400">ВХОД</text><text x="69" y="254" font-size="27" fill="#fff" font-weight="500">Исходные данные</text><circle cx="74" cy="286" r="3" fill="#9cc6f7"/><text x="89" y="292" font-size="19" fill="#d0deea" font-weight="400">Файлы и требования</text><circle cx="74" cy="316" r="3" fill="#9cc6f7"/><text x="89" y="322" font-size="19" fill="#d0deea" font-weight="400">Проверка комплектности</text><circle cx="74" cy="346" r="3" fill="#9cc6f7"/><text x="89" y="352" font-size="19" fill="#d0deea" font-weight="400">Подготовка к сборке</text><circle cx="410" cy="310" r="5" fill="#c2deff"/><rect x="425" y="175" width="350" height="300" rx="12" fill="#2a4c6d" stroke="#8eb5df"/><text x="449" y="210" font-size="14" fill="#b0c9df" font-weight="400">ПРОЦЕСС</text><text x="449" y="254" font-size="27" fill="#fff" font-weight="500">Сборка документа</text><circle cx="454" cy="286" r="3" fill="#9cc6f7"/><text x="469" y="292" font-size="19" fill="#d0deea" font-weight="400">Структура отчёта</text><circle cx="454" cy="316" r="3" fill="#9cc6f7"/><text x="469" y="322" font-size="19" fill="#d0deea" font-weight="400">Текст и изображения</text><circle cx="454" cy="346" r="3" fill="#9cc6f7"/><text x="469" y="352" font-size="19" fill="#d0deea" font-weight="400">Формирование DOCX</text><circle cx="790" cy="310" r="5" fill="#c2deff"/><rect x="805" y="175" width="350" height="300" rx="12" fill="#20374b" stroke="#4e6a82"/><text x="829" y="210" font-size="14" fill="#b0c9df" font-weight="400">ВЫХОД</text><text x="829" y="254" font-size="27" fill="#fff" font-weight="500">Проверка и архив</text><circle cx="834" cy="286" r="3" fill="#9cc6f7"/><text x="849" y="292" font-size="19" fill="#d0deea" font-weight="400">Обязательные разделы</text><circle cx="834" cy="316" r="3" fill="#9cc6f7"/><text x="849" y="322" font-size="19" fill="#d0deea" font-weight="400">Наличие вложений</text><circle cx="834" cy="346" r="3" fill="#9cc6f7"/><text x="849" y="352" font-size="19" fill="#d0deea" font-weight="400">Состав итогового архива</text><text x="45" y="530" font-size="19" fill="#bdd0e0" font-weight="400">Проверка структуры и файлов не заменяет отдельную проверку содержания.</text><text x="45" y="575" font-size="13" fill="#90adc4" font-weight="400">Реальные компоненты проекта · функциональная схема, не скриншот</text></g></svg>